<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <title>Hexbloop Settings</title>
    <link rel="stylesheet" href="preferences.css">
</head>
<body>
    <div class="preferences-container">
        <header class="settings-header">
            <div class="tab-bar" role="tablist" aria-label="Settings">
                <button class="tab-button active" id="output-label" data-tab="output" role="tab" aria-selected="true" aria-controls="output-tab">Output</button>
                <button class="tab-button" id="character-label" data-tab="character" role="tab" aria-selected="false" aria-controls="character-tab" tabindex="-1">Character</button>
            </div>
            <details class="settings-menu" id="settingsMenu">
                <summary aria-label="Settings actions">•••</summary>
                <div class="settings-menu-items">
                    <button type="button" id="export-btn">Export Settings…</button>
                    <button type="button" id="import-btn">Import Settings…</button>
                    <button type="button" id="reset-btn">Reset to Defaults…</button>
                </div>
            </details>
        </header>
        <main class="preferences-content">
            <section class="tab-panel active" id="output-tab" role="tabpanel" aria-labelledby="output-label">
                <div class="setting-row destination-row">
                    <label for="output-folder">Destination</label>
                    <div class="folder-input-group">
                        <input type="text" id="output-folder" data-setting="ui.outputFolder" readonly title="Output folder">
                        <button type="button" id="choose-folder-btn">Choose…</button>
                    </div>
                </div>
                <div class="setting-row">
                    <label for="output-format">Format</label>
                    <select id="output-format" data-setting="output.format">
                        <option value="source">Source</option><option value="mp3">MP3</option><option value="wav">WAV</option><option value="flac">FLAC</option>
                    </select>
                </div>
                <div class="setting-row">
                    <label for="batch-session-folders">Session folders<small>Each batch in its own folder.</small></label>
                    <input type="checkbox" id="batch-session-folders" data-setting="batch.sessionFolders" role="switch">
                </div>
                <div class="setting-row" id="batch-folder-scheme-wrapper" hidden>
                    <label for="batch-folder-scheme">Folder names</label>
                    <select id="batch-folder-scheme" data-setting="batch.folderScheme">
                        <option value="date">Date</option><option value="lunar">Moon phase</option><option value="counter">Session number</option>
                    </select>
                </div>
            </section>
            <section class="tab-panel" id="character-tab" role="tabpanel" aria-labelledby="character-label" hidden>
                <div class="setting-row">
                    <label for="artwork-style">Artwork</label>
                    <select id="artwork-style" data-setting="artwork.defaultStyle">
                        <option value="auto">Auto · audio-driven</option>
                        <option value="neon-plasma">Neon Plasma</option><option value="cosmic-flow">Cosmic Flow</option>
                        <option value="vapor-dream">Vapor Dream</option><option value="cyber-matrix">Cyber Matrix</option>
                        <option value="sunset-liquid">Sunset Liquid</option><option value="electric-storm">Electric Storm</option>
                        <option value="crystal-prism">Crystal Prism</option><option value="ocean-aurora">Ocean Aurora</option>
                    </select>
                </div>
                <div class="setting-row naming-row">
                    <label for="custom-words">Word bank<small>One word per line. Mixed into generated names.</small></label>
                    <textarea id="custom-words" data-setting="batch.customWords" rows="3" maxlength="2000" placeholder="moss&#10;brick&#10;static"></textarea>
                </div>
                <fieldset class="setting-row metadata-modes">
                    <legend class="sr-only">Metadata</legend>
                    <span aria-hidden="true">Metadata</span>
                    <div class="radio-options">
                        <label><input type="radio" id="metadata-generated" name="metadata-mode" value="generated" data-setting="metadata.mode"> Generated</label>
                        <label><input type="radio" id="metadata-custom" name="metadata-mode" value="custom" data-setting="metadata.mode"> Custom</label>
                    </div>
                </fieldset>
                <div id="custom-metadata-section" class="metadata-fields" hidden>
                    <label for="custom-artist">Artist<input type="text" id="custom-artist" data-setting="metadata.artist" maxlength="100" placeholder="Artist name"></label>
                    <label for="custom-album">Album<input type="text" id="custom-album" data-setting="metadata.album" maxlength="100" placeholder="Album title"></label>
                    <label for="custom-year">Year<input type="number" id="custom-year" data-setting="metadata.year" min="1900" max="2100"></label>
                    <label for="custom-genre">Genre<input type="text" id="custom-genre" data-setting="metadata.genre" maxlength="50" placeholder="Genre"></label>
                </div>
                <div class="setting-row">
                    <label for="ambientAudio">Background sound<small>The room between tracks.</small></label>
                    <input type="checkbox" id="ambientAudio" data-setting="ui.ambientAudio" role="switch">
                </div>
            </section>
        </main>
        <footer class="preferences-footer"><p id="settings-status" role="status" aria-live="polite"></p></footer>
    </div>
    <div class="loading-overlay" id="loadingOverlay" role="status"><p class="loading-text">Saving…</p></div>
    <script src="preferences.js"></script>
</body>
</html>
